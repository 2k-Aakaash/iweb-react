# Builds iweb-react on every push to main and publishes the build to the
# 2k-Aakaash/iWeb repository:
#   - build files are committed to iWeb's `build` branch (iWeb `main` is never touched)
#   - a new GitHub Release (marked Latest) is created from that commit with
#     iWeb.Extension.zip attached
#
# Versioning (scripts/next-version.mjs), from the latest iWeb release + pushed commits:
#   "feat: …"  → minor (v2.3 → v2.4) · "[major]" → major (v3.0) · anything else → patch (v2.4.1)
#
# Required setup in iweb-react → Settings → Secrets and variables → Actions:
#   Secret   IWEB_DEPLOY_TOKEN     fine-grained PAT, repo 2k-Aakaash/iWeb, permission Contents: Read and write
#   Variable UNSPLASH_PROXY_URL    e.g. https://your-app.vercel.app/api/unsplash (the extension has no server of its own)
#   Variable UNSPLASH_APP_NAME     optional, defaults to "iweb"

name: Release build to iWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-to-iweb
  cancel-in-progress: false

env:
  TARGET_REPO: 2k-Aakaash/iWeb
  TARGET_BRANCH: build

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout iweb-react
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all pushed commit messages decide the version bump

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Compute release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.IWEB_DEPLOY_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Latest iWeb release (tag + name); empty on the very first release.
          export LATEST_TAG=$(gh release view --repo "$TARGET_REPO" --json tagName -q .tagName 2>/dev/null || true)
          export LATEST_NAME=$(gh release view --repo "$TARGET_REPO" --json name -q .name 2>/dev/null || true)
          export FALLBACK_VERSION=$(node -p "require('./public/manifest.json').version")
          # Messages of every commit in this push (just HEAD for manual runs / new branches).
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git log --format='%B%x00' "$BEFORE..$GITHUB_SHA" > commit-messages.txt
          else
            git log -1 --format='%B%x00' "$GITHUB_SHA" > commit-messages.txt
          fi
          COMMIT_MESSAGES_FILE=commit-messages.txt node scripts/next-version.mjs
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # Baked into the bundle so the extension's updater knows its own release.
          VITE_IWEB_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VITE_UNSPLASH_PROXY_URL: ${{ vars.UNSPLASH_PROXY_URL }}
          UNSPLASH_APP_NAME: ${{ vars.UNSPLASH_APP_NAME || 'iweb' }}
        run: npm run build

      - name: Stamp manifest version and file list
        run: |
          # Chrome shows this in chrome://extensions (e.g. 2.3.0, with "v2.3" as the name).
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.manifest_version }}';
            m.version_name = '${{ steps.version.outputs.tag }}';
            fs.writeFileSync('dist/manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          # File list lets the in-extension updater delete files a newer release drops.
          (cd dist && find . -type f ! -name '*.map' | sed 's|^\./||' | sort) > files.txt
          echo "release-files.json" >> files.txt
          node -e "const l=require('fs').readFileSync('files.txt','utf8').trim().split('\n');require('fs').writeFileSync('dist/release-files.json', JSON.stringify(l, null, 2))"

      - name: Package extension zip and checksum
        run: |
          cd dist
          zip -r ../iWeb.Extension.zip . -x '*.map'
          cd ..
          sha256sum iWeb.Extension.zip > iWeb.Extension.zip.sha256

      - name: Push build to iWeb `build` branch
        env:
          TOKEN: ${{ secrets.IWEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898299+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads "$REMOTE" "$TARGET_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$TARGET_BRANCH" "$REMOTE" target
          else
            # First run: create an orphan branch containing only build output.
            git init target
            git -C target checkout --orphan "$TARGET_BRANCH"
            git -C target remote add origin "$REMOTE"
          fi

          # Replace the branch contents with the fresh build.
          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. target/

          cd target
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged; reusing current commit."
          else
            git commit -m "Build from iweb-react@${{ steps.version.outputs.short_sha }}" \
                       -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create Latest release in iWeb
        env:
          GH_TOKEN: ${{ secrets.IWEB_DEPLOY_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" iWeb.Extension.zip iWeb.Extension.zip.sha256 \
            --repo "$TARGET_REPO" \
            --target "$BUILD_COMMIT" \
            --title "iWeb ${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.version.outputs.kind }} release · automated build of [iweb-react@${{ steps.version.outputs.short_sha }}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          Install: download **iWeb.Extension.zip**, unzip it, then open chrome://extensions → enable Developer mode → Load unpacked → select the unzipped folder." \
            --latest
